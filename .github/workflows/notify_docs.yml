name: Notify Docs Sync

on:
  push:
    branches: [master]
    paths:
      - 'modules/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to CTNH-Docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 用 repository_dispatch 通知 CTNH-Docs 的 Auto Sync Docs workflow 同步最新提交。
          # GITHUB_TOKEN 仅对当前仓库有效；CTNH-Docs 是同一组织下的公开仓库，
          # 若 dispatch 失败请配置组织级 PAT secret（如 CTNH_DOCS_PAT）并改用下方注释行。
          curl -sS -X POST \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/CTNH-Team/CTNH-Docs/dispatches \
            -d '{"event_type":"sync-docs","client_payload":{"trigger":"push","ref":"master","sha":"${{ github.sha }}"}}' \
            && echo "dispatched ok" || echo "dispatch failed (schedule fallback will cover)"
